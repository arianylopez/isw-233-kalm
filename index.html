<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio de Ariany Lopez</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="main-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-box">
                    <span>AL</span>
                </div>
                <h2 class="profile-name">Ariany Lopez</h2>
            </div>
            
            <nav class="navbar">
                <ul>
                    <li>
                        <a href="#inicio" class="active">
                            <i class="fas fa-home"></i> <span>INICIO</span>
                        </a>
                    </li>
                    <li>
                        <a href="#sobre-mi">
                            <i class="far fa-user"></i> <span>SOBRE MÍ</span>
                        </a>
                    </li>
                    <li>
                        <a href="#curriculum">
                            <i class="far fa-file-alt"></i> <span>CURRICULUM</span>
                        </a>
                    </li>
                    <li>
                        <a href="#portafolio">
                            <i class="fas fa-briefcase"></i> <span>PORTAFOLIO</span>
                        </a>
                    </li>
                    <li>
                        <a href="#blog">
                            <i class="fas fa-book-open"></i> <span>BLOG</span>
                        </a>
                    </li>
                    <li>
                        <a href="#contacto">
                            <i class="far fa-envelope"></i> <span>CONTACTO</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="theme-wrapper">
                <i class="far fa-moon moon-icon"></i>
                <label class="switch">
                    <input type="checkbox" id="theme-toggle">
                    <span class="slider round"></span>
                </label>
            </div>
        </aside>

        <main class="content">
            
            <section id="inicio" class="hero-section">
                <div class="hero-content-wrapper">
                    <div class="hero-text">
                        <span class="greeting-text">ESTUDIANTE DE INGENIERÍA DE SOFTWARE</span>
                        <h1>Hola, Soy <br> Ariany Lopez !</h1>
                        <div class="placeholder-text">
                            <p>XXXXXXX</p>
                            <p>XXXXXXXXXXXXXXXXXXXXXXXX</p>
                            <p>XXXXXXXXXXXXXXXXXX</p>
                            <p>XXXXXXXXXXXXXXXXXXXX</p>
                        </div>
                        
                        <div class="hero-buttons">
                            <a href="#proyectos" class="btn btn-white">VER PROYECTOS</a>
                            <a href="#contacto" class="btn btn-outline-white">CONTÁCTAME</a>
                        </div>
                    </div>

                    <div class="hero-image">
                        <div class="image-wrapper">
                            <img src="img/avatar.png" alt="Ariany Lopez Avatar" class="avatar-img">
                        </div>
                    </div>
                </div>
                
                <div class="scroll-down">
                    <i class="fas fa-arrow-down"></i>
                </div>
                <div class="carousel-indicators">
                    <span class="indicator active"></span>
                    <span class="indicator"></span>
                    <span class="indicator"></span>
                </div>
            </section>

            </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
